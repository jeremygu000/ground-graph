[project]
name = "groundgraph"
version = "0.1.0"
description = "Hybrid Agentic GraphRAG system with vertical knowledge graph, horizontal workflow graph, and queryable execution graph"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "groundgraph Authors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "neo4j>=5.26.0",
    "openai>=1.54.0",
    "httpx>=0.27.2",
    "boto3>=1.35.0",
    "minio>=7.2.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres,neo4j,minio]>=4.8.0",
    "ruff>=0.7.0",
    "pyright>=1.1.380",
    "deepeval>=2.0.0",
    "respx>=0.21.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
ingestion = [
    "markdown-it-py>=3.0.0",
    "beautifulsoup4>=4.12.3",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "ebooklib>=0.18",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundgraph"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ",
    "PT", "RET", "SIM", "TID", "RUF", "PL", "TRY", "ASYNC",
]
ignore = [
    "TRY003",  # Allow long messages outside exceptions
    "PLR0913", # Allow many args
    "B008",    # FastAPI dependency pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101", "ARG"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "integration: marks tests as integration (requires Docker)",
    "contract: marks tests as contract tests",
    "e2e: marks tests as end-to-end",
    "adversarial: marks tests as adversarial",
    "slow: marks tests as slow",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:openai.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
source = ["src/groundgraph"]
branch = true
omit = [
    "*/infrastructure/*",
    "*/api/*",
    "*/workflows/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
exclude_also = [
    "src/groundgraph/infrastructure/.*",
    "src/groundgraph/api/.*",
    "src/groundgraph/workflows/.*",
]

[tool.pyright]
include = ["src", "tests", "apps"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    "**/build",
    "**/dist",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownParameterType = "warning"
reportUnknownLambdaType = "warning"
reportMissingTypeArgument = "warning"
reportAttributeAccessIssue = "warning"
useLibraryCodeForTypes = true
strict = ["src/groundgraph/domain", "src/groundgraph/application"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/groundgraph/domain", "src/groundgraph/application"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
exclude = [
    "^tests/",
    "^deploy/",
    "^scripts/",
]
