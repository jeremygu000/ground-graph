name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  UV_VERSION: "0.8.11"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright type check
        run: uv run pyright

      - name: Mypy strict (domain + application)
        run: uv run mypy

      - name: Pytest with coverage gate
        run: uv run pytest -q -m "not integration and not e2e" --cov=src/groundgraph --cov-fail-under=85

      - name: Docker compose config
        run: |
          env NEO4J_USER=neo4j NEO4J_PASSWORD=ci \
              POSTGRES_USER=groundgraph POSTGRES_PASSWORD=ci \
              PHOENIX_DB=phoenix \
              docker compose -f docker-compose.yml config -q

      - name: Secret scan (basic)
        run: |
          if grep -RInE "(api[_-]?key|token|secret|password)\s*=\s*['\"][^'\"\n]{8,}" . \
              --include="*.py" --include="*.yml" --include="*.yaml" --include="*.env" \
              --exclude-dir=.venv --exclude-dir=.git --exclude-dir=deploy; then
            echo "Possible hardcoded secret detected above"
            exit 1
          fi
