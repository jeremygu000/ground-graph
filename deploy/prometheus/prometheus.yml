global:
  scrape_interval: 15s
  evaluation_interval: 15s

# groundgraph has three independent Prometheus scrape targets. They are
# split by job so that dashboards and alerts can attribute metrics to
# their producer without ambiguity.
#
#   job_name                       | endpoint               | metrics
#   ------------------------------ | ---------------------- | -------------------------------
#   otel-collector-internal        | otel-collector:8888    | otelcol_* (self-telemetry)
#   groundgraph-application         | otel-collector:8889    | app metrics via OTLP
#   phoenix                        | phoenix:9090           | Phoenix AI traces UI

scrape_configs:
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: opentelemetry-collector
          metrics_source: collector-internal

  - job_name: groundgraph-application
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: opentelemetry-collector
          metrics_source: application-otlp

  - job_name: phoenix
    metrics_path: /metrics
    static_configs:
      - targets: ["phoenix:9090"]
        labels:
          service: phoenix
          metrics_source: phoenix-self
