global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: opentelemetry-collector

  - job_name: phoenix
    metrics_path: /metrics
    static_configs:
      - targets: ["phoenix:6006"]
        labels:
          service: phoenix
