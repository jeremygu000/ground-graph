name: groundgraph

# Local development infrastructure.
# All services run in containers with health checks and persistent volumes.
# Production deployment is explicitly out of scope for MVP (see plan.md §1.4).
#
# This file is reviewed against the M1 acceptance criteria. See AGENTS.md §6.

x-logging-default: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-restart-unless-stopped: &restart
  restart: unless-stopped

x-pg-env: &pg-env
  POSTGRES_USER: ${POSTGRES_USER:-groundgraph}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
  POSTGRES_DB: ${POSTGRES_DB:-groundgraph}

x-s3-env: &s3-env
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-change-me-local-only}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-local-only}
  S3_BUCKET_RAW: ${S3_BUCKET_RAW:-groundgraph-raw}
  S3_BUCKET_PROCESSED: ${S3_BUCKET_PROCESSED:-groundgraph-processed}

x-neo4j-env: &neo4j-env
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-local-only}

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector (application database; managed via Alembic)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16.4
    <<: [*restart, *logging]
    environment:
      <<: *pg-env
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - groundgraph-net

  # ---------------------------------------------------------------------------
  # Neo4j
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26.10-community
    <<: [*restart, *logging]
    environment:
      <<: *neo4j-env
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '[]'
      NEO4J_dbms_security_procedures_unrestricted: ''
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u "$$NEO4J_USER" -p "$$NEO4J_PASSWORD" "RETURN 1;" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - groundgraph-net

  # ---------------------------------------------------------------------------
  # MinIO (S3-compatible object storage)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    <<: [*restart, *logging]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-change-me-local-only}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-local-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - /usr/bin/mc
        - ready
        - local
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - groundgraph-net

  minio-init:
    image: minio/mc:RELEASE.2024-10-29T15-34-59Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *s3-env
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local "http://minio:9000" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET_RAW"
        mc mb --ignore-existing "local/$$S3_BUCKET_PROCESSED"
        mc anonymous set none "local/$$S3_BUCKET_RAW"
        mc anonymous set none "local/$$S3_BUCKET_PROCESSED"
    restart: "no"
    networks:
      - groundgraph-net

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    <<: [*restart, *logging]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/docker/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      phoenix:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - healthcheck
        - --config=/etc/otelcol/config.yaml
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - groundgraph-net

  # ---------------------------------------------------------------------------
  # Arize Phoenix (AI traces UI) — dedicated database
  # ---------------------------------------------------------------------------
  phoenix:
    image: arizephoenix/phoenix:8.29.1
    <<: [*restart, *logging]
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER:-groundgraph}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${PHOENIX_DB:-phoenix}
      PHOENIX_ENABLE_AUTH: "false"
      PHOENIX_GRPC_PORT: "4317"
    ports:
      - "127.0.0.1:6006:6006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6006/healthz', timeout=2).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - groundgraph-net

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    <<: [*restart, *logging]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - /bin/prometheus
        - --version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - groundgraph-net

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    <<: [*restart, *logging]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - groundgraph-net

networks:
  groundgraph-net:
    driver: bridge

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  minio-data:
  prometheus-data:
  grafana-data:
